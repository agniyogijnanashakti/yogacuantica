<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Camino de Yoga Cuántico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06060f;
  --text: #e2d9c8;
  --text-dim: rgba(226,217,200,0.52);
  --text-faint: rgba(226,217,200,0.2);
  --accent: rgba(160,120,240,0.88);
  --accent-dim: rgba(160,120,240,0.35);
  --accent-faint: rgba(160,120,240,0.09);
  --gold: rgba(210,175,100,0.8);
  --gold-dim: rgba(210,175,100,0.35);
  --border: rgba(226,217,200,0.07);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Crimson Pro',Georgia,serif;min-height:100vh;overflow-x:hidden}

/* starfield */
#starfield{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;border-radius:50%;background:white;animation:twinkle var(--d,4s) ease-in-out infinite var(--delay,0s)}
@keyframes twinkle{0%,100%{opacity:var(--min-op,.1)}50%{opacity:var(--max-op,.6)}}

/* nebula */
#nebula{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 55% 35% at 15% 20%, rgba(80,40,160,0.13) 0%,transparent 70%),
    radial-gradient(ellipse 40% 55% at 88% 78%, rgba(30,60,130,0.10) 0%,transparent 70%),
    radial-gradient(ellipse 60% 30% at 55% 5%,  rgba(120,45,80,0.07) 0%,transparent 60%)}

/* overlay */
#overlay{position:fixed;inset:0;z-index:100;background:var(--bg);pointer-events:none;opacity:0;transition:opacity .28s ease}
#overlay.fading{opacity:1}

/* layout */
#app{position:relative;z-index:1;max-width:740px;margin:0 auto;padding:0 28px 100px;min-height:100vh}

/* ── COVER ── */
#cover{padding-top:88px;text-align:center;animation:riseIn 1s cubic-bezier(.22,1,.36,1) both}
.cover-tag{display:inline-block;font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--accent-dim);padding-bottom:10px;margin-bottom:38px}
.cover-title{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(2.6rem,7vw,4.4rem);line-height:1.07;letter-spacing:-.02em;color:#f4ede0;margin-bottom:20px}
.cover-title em{font-style:italic;color:var(--accent);display:block}
.cover-subtitle{font-family:'Crimson Pro',serif;font-size:16px;font-style:italic;color:var(--text-dim);letter-spacing:.06em;margin-bottom:18px}
.cover-dim-note{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:52px}
.cover-divider{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:68px}
.cover-divider::before,.cover-divider::after{content:'';width:80px;height:1px}
.cover-divider::before{background:linear-gradient(to right,transparent,var(--accent-dim))}
.cover-divider::after{background:linear-gradient(to left,transparent,var(--accent-dim))}
.cover-ornament{font-size:18px;color:var(--accent-dim)}

/* ── INDEX ── */
#index{animation:riseIn .8s cubic-bezier(.22,1,.36,1) .15s both}
.index-section-label{font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.45em;text-transform:uppercase;color:var(--text-faint);margin-bottom:12px;margin-top:36px;padding-left:4px}
.chapter-btn{display:flex;align-items:flex-start;gap:20px;width:100%;text-align:left;background:transparent;border:1px solid var(--border);border-radius:3px;padding:18px 22px;margin-bottom:4px;cursor:pointer;color:var(--text);font-family:inherit;transition:background .22s,border-color .22s,transform .2s;position:relative;overflow:hidden}
.chapter-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);transform:scaleY(0);transform-origin:bottom;transition:transform .3s cubic-bezier(.22,1,.36,1)}
.chapter-btn.dim-chapter::before{background:var(--gold)}
.chapter-btn:hover{background:var(--accent-faint);border-color:var(--accent-dim);transform:translateX(3px)}
.chapter-btn.dim-chapter:hover{background:rgba(210,175,100,0.06);border-color:var(--gold-dim)}
.chapter-btn:hover::before{transform:scaleY(1)}
.ch-num{font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent-dim);min-width:60px;padding-top:4px;flex-shrink:0;line-height:1.3}
.chapter-btn.dim-chapter .ch-num{color:var(--gold-dim)}
.ch-info{display:flex;flex-direction:column;gap:4px}
.ch-title-idx{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:400;color:rgba(226,217,200,.88);line-height:1.35}
.ch-dim-name{font-family:'Crimson Pro',serif;font-size:13px;font-style:italic;color:var(--gold-dim)}
.cover-footer{text-align:center;margin-top:72px;font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--accent-dim)}

/* ── CHAPTER VIEW ── */
#chapter-view{padding-top:52px;display:none}
#chapter-view.active{display:block;animation:riseIn .5s cubic-bezier(.22,1,.36,1) both}
.back-btn{background:none;border:none;cursor:pointer;color:var(--text-faint);font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.3em;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:56px;padding:0;transition:color .2s}
.back-btn:hover{color:var(--accent)}
.back-btn:hover svg{transform:translateX(-3px)}
.back-btn svg{transition:transform .2s}
.chapter-eyebrow{font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.45em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.chapter-dim-name{font-family:'Crimson Pro',serif;font-size:15px;font-style:italic;color:var(--gold);margin-bottom:16px;letter-spacing:.03em}
.chapter-heading{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(1.7rem,5vw,2.6rem);line-height:1.18;color:#f4ede0;margin-bottom:48px;letter-spacing:-.01em}

/* formula box */
.formula-box{border:1px solid var(--gold-dim);border-radius:4px;padding:20px 24px;margin-bottom:44px;background:rgba(210,175,100,0.04);text-align:center}
.formula-label{font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:10px}
.formula-expr{font-family:'Cormorant Garamond',serif;font-size:22px;font-style:italic;color:var(--gold);letter-spacing:.04em;line-height:1.5}
.formula-desc{font-family:'Crimson Pro',serif;font-size:13px;color:var(--text-dim);margin-top:8px;font-style:italic}

/* body text */
.chapter-body{border-left:1px solid var(--accent-dim);padding-left:28px;margin-bottom:40px}
.chapter-body p{font-size:17.5px;line-height:1.9;color:rgba(226,217,200,.82);margin-bottom:26px;font-weight:300}
.chapter-body p:last-child{margin-bottom:0}

/* practice blocks */
.practice-section{margin-bottom:44px}
.practice-title{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--accent-dim);margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.practice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.practice-card{background:var(--accent-faint);border:1px solid var(--border);border-radius:3px;padding:14px 16px}
.practice-card.breath{background:rgba(210,175,100,0.05);border-color:rgba(210,175,100,0.12)}
.practice-card-title{font-family:'Cormorant Garamond',serif;font-size:14px;color:rgba(226,217,200,.9);margin-bottom:4px;font-style:italic}
.practice-card-desc{font-family:'Crimson Pro',serif;font-size:13px;color:var(--text-dim);line-height:1.55}

/* nav */
.chapter-nav{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:32px;gap:16px;margin-top:8px}
.nav-btn{background:none;border:1px solid var(--border);border-radius:3px;padding:12px 18px;cursor:pointer;color:var(--text-dim);font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:10px;transition:all .2s;min-width:80px}
.nav-btn:hover:not(:disabled){background:var(--accent-faint);border-color:var(--accent-dim);color:var(--accent)}
.nav-btn:disabled{opacity:.2;cursor:default}
.nav-progress{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.2em;color:var(--text-faint);white-space:nowrap}

@keyframes riseIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--accent-dim);border-radius:2px}
</style>
</head>
<body>
<div id="nebula"></div>
<div id="starfield"></div>
<div id="overlay"></div>

<div id="app">
  <!-- HOME -->
  <div id="home-view">
    <div id="cover">
      <div class="cover-tag">Filosofía &middot; Física &middot; Yoga</div>
      <h1 class="cover-title">Camino de<em>Yoga Cuántico</em></h1>
      <p class="cover-subtitle">Una filosofía del ser en superposición</p>
      <p class="cover-dim-note">11 Dimensiones · 11 Prácticas · 11 Fórmulas</p>
      <div class="cover-divider"><span class="cover-ornament">✦</span></div>
    </div>
    <div id="index">
      <p class="index-section-label">Fundamentos</p>
      <div id="list-base"></div>
      <p class="index-section-label">Las Once Dimensiones</p>
      <div id="list-dim"></div>
      <p class="index-section-label">Cierre</p>
      <div id="list-close"></div>
      <div class="cover-footer">Carpe Diem</div>
    </div>
  </div>

  <!-- CHAPTER -->
  <div id="chapter-view">
    <button class="back-btn" onclick="goHome()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="15 18 9 12 15 6"/></svg>
      Índice
    </button>
    <div class="chapter-eyebrow" id="ch-number"></div>
    <div class="chapter-dim-name" id="ch-dimname"></div>
    <h2 class="chapter-heading" id="ch-title"></h2>
    <div id="ch-formula"></div>
    <div class="chapter-body" id="ch-body"></div>
    <div id="ch-practices"></div>
    <div class="chapter-nav">
      <button class="nav-btn" id="btn-prev" onclick="navChapter(-1)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        <span id="prev-label"></span>
      </button>
      <span class="nav-progress" id="nav-progress"></span>
      <button class="nav-btn" id="btn-next" onclick="navChapter(1)">
        <span id="next-label"></span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const CHAPTERS = [
  // ── FUNDAMENTOS ──
  {
    type: "base",
    number: "Prólogo",
    dimName: "",
    title: "El observador que colapsa el mundo",
    formula: null,
    content: [
      "Todo sistema cuántico existe en superposición hasta que es observado. El acto de observar colapsa la función de onda: de lo potencial emerge lo real.",
      "El ser humano es, en su esencia, un observador. Pero a diferencia del instrumento de medición físico, el observador consciente no solo colapsa la realidad exterior: también se colapsa a sí mismo.",
      "Este libro es una cartografía de ese proceso. No una doctrina. Una herramienta para quien ya sospecha que la realidad es más porosa de lo que la mente ordinaria admite.",
      "El Camino de Yoga Cuántico no prescribe posiciones corporales ni dogmas metafísicos. Es una disciplina de la atención: la práctica sistemática de habitar el instante con precisión creciente.",
      "Carpe Diem no es un hedonismo superficial. Es una ontología: el presente es el único dominio donde el ser colapsa desde posibilidad hacia acto."
    ],
    asanas: [], pranayama: []
  },
  {
    type: "base",
    number: "I",
    dimName: "",
    title: "La teoría M y el yo múltiple",
    formula: null,
    content: [
      "La teoría M postula once dimensiones y un multiverso de membranas vibrantes. Desde la física, esto no es metáfora: es la arquitectura más plausible del cosmos.",
      "Para la psicología del yo, esta estructura es iluminadora. El yo no es una sustancia fija sino un patrón vibracional que se actualiza en cada instante. Lo que llamamos «identidad» es la coherencia estadística de esos patrones a través del tiempo.",
      "Jung denominó al yo la función sintética del psiquismo: no es el centro de la conciencia, sino su intento de narrativa continua. Desde el Camino, el yo es una membrana: permeable, vibratoria, en permanente negociación con otras membranas.",
      "La patología psicológica más frecuente es la rigidez de membrana: el yo que se cierra, que deja de vibrar, que confunde su forma actual con su forma definitiva.",
      "La práctica: percibir el yo como proceso, no como cosa. Observar sus oscilaciones sin identificarse compulsivamente con ninguna de sus fases."
    ],
    asanas: [], pranayama: []
  },
  {
    type: "base",
    number: "II",
    dimName: "",
    title: "El presente como colapso de posibilidad",
    formula: null,
    content: [
      "En mecánica cuántica, el principio de superposición establece que un sistema existe en todos sus estados posibles simultáneamente hasta que la medición fuerza la actualización de uno. El pasado es un colapso ya ocurrido —irreversible. El futuro es superposición pura —probabilidad sin forma.",
      "El presente es el borde: el único punto donde el observador puede incidir.",
      "La mente ordinaria —lo que Tolle denomina el «dolor-cuerpo» y la tradición budista llama samsara— oscila compulsivamente entre la memoria del colapso pasado y la ansiedad ante el colapso futuro. Ninguno de esos dominios es modificable desde la acción presente.",
      "El Camino es una disciplina de retorno al borde. No como negación del pasado o el futuro, sino como reconocimiento de que el único lugar donde la conciencia puede ejercer causalidad es el instante en curso.",
      "Carpe Diem, comprendido así, no es impulsividad. Es precisión ontológica: actuar desde el único punto de contacto real con la realidad."
    ],
    asanas: [], pranayama: []
  },
  {
    type: "base",
    number: "III",
    dimName: "",
    title: "Entrelazamiento y relación",
    formula: null,
    content: [
      "El entrelazamiento cuántico describe dos partículas que, una vez en contacto, mantienen correlación instantánea independientemente de la distancia. Medir una define el estado de la otra, sin señal que viaje entre ellas.",
      "En psicología vincular, algo análogo ocurre: dos seres que se han encontrado en profundidad no retornan a su independencia original. El campo compartido persiste. No como dependencia patológica, sino como transformación estructural mutua.",
      "La honestidad —valor central de este camino— es la práctica que mantiene limpio ese campo. La deshonestidad introduce interferencia: distorsiona el entrelazamiento, genera ruido donde podría haber resonancia.",
      "La relación auténtica no aspira a fusión —eso es confusión de membranas— ni a distancia protectora —eso es aislamiento de membrana. Aspira a contacto preciso: dos vibraciones que se reconocen sin anularse.",
      "El amor, en este marco, no es un estado emocional sino un modo de atención: la disposición a ver al otro en su singularidad, sin proyectarlo sobre la pantalla del propio sistema de referencia."
    ],
    asanas: [], pranayama: []
  },
  {
    type: "base",
    number: "IV",
    dimName: "",
    title: "El yoga como laboratorio de presencia",
    formula: null,
    content: [
      "El yoga no es gimnasia. No es estiramiento sofisticado ni estética de bienestar. En su raíz etimológica —yuj, unir— el yoga es la práctica de reunir lo que la mente fragmenta: cuerpo y conciencia, instante y atención, movimiento y quietud.",
      "En términos cuánticos, el yoga es un colapso deliberado: la práctica de forzar la superposición dispersa del pensamiento hacia un punto de actualización presente. Cada postura —asana— es una pregunta que el cuerpo le hace a la conciencia: ¿estás aquí?",
      "La respiración es el operador fundamental. El pranayama no regula el aire; regula la atención. Al anclar la conciencia en el ciclo respiratorio, se interrumpe el bucle automático del pensamiento compulsivo.",
      "La dificultad de una postura no reside en la flexibilidad muscular. Reside en la capacidad de permanecer como observador mientras el cuerpo reporta incomodidad. Esta es la práctica central del Camino: no eliminar la tensión, sino aprender a habitarla sin colapsar en la reacción.",
      "Lo que define la práctica no es la forma sino la calidad de la atención que la atraviesa. Una postura hecha con la mente en el pasado es gimnasia. La misma postura habitada desde el borde del instante es yoga."
    ],
    asanas: [], pranayama: []
  },
  {
    type: "base",
    number: "V",
    dimName: "",
    title: "La aceptación como acto cuántico",
    formula: null,
    content: [
      "Aceptar no es resignarse. La resignación es una rendición del querer —el deseo que abdica. La aceptación es un reconocimiento del colapso ya ocurrido: este estado es el estado actual del sistema. Negarle existencia no lo modifica; solo divide la energía disponible para la acción.",
      "El duelo —de una relación, de una identidad, de un sueño— es el proceso de actualizar el mapa cognitivo-emocional a la nueva topología de la realidad. Un proceso que no tiene atajos, pero que puede tener acompañamiento.",
      "En términos cuánticos: el colapso ya ocurrió. La función de onda de ese estado posible se contrajo. Resistir el colapso es intentar reabrir una superposición que ya no existe.",
      "La aceptación libera la energía que estaba detenida en la resistencia. Esa energía disponible es la materia prima del siguiente colapso —del próximo instante elegido con presencia."
    ],
    asanas: [], pranayama: []
  },

  // ── LAS ONCE DIMENSIONES ──
  {
    type: "dim",
    number: "Dimensión I",
    dimName: "Ādhāra — La Dimensión del Sustrato",
    title: "Enraizamiento: la postura como ancla gravitacional",
    formula: {
      expr: "S₁ = ∫₀^∞ ρ(x) · g(x) dx",
      desc: "La acción del sustrato S₁ es la integral de densidad presencial ρ sobre el campo gravitacional g — todo ser necesita tierra antes de cielo."
    },
    content: [
      "La primera dimensión de la teoría M es la más elemental: la extensión espacial que permite que algo ocupe un lugar. Sin Ādhāra —sustrato en sánscrito— ninguna otra dimensión tiene donde desplegarse. Es el suelo de toda existencia posible.",
      "En el cuerpo, Ādhāra corresponde a los pies, las piernas, el perineo, la base de la columna. Es la zona donde el sistema nervioso registra si estamos seguros o amenazados. La mayoría de los seres humanos modernos habita esta dimensión con ansiedad crónica: el cuerpo reporta peligro aunque la mente no encuentre su fuente.",
      "La práctica de Ādhāra es simple y radical: volver al contacto con el suelo. Sentir el peso real del cuerpo sobre la tierra. Dejar que la gravedad —esa fuerza que curva el espacio-tiempo según Einstein— haga su trabajo sin resistencia.",
      "Desde la física cuántica, el vacío cuántico nunca está vacío: hierve con fluctuaciones virtuales de energía. El suelo no es ausencia; es el campo más denso de potencial no manifestado. Pisar conscientemente es participar de esa densidad."
    ],
    asanas: [
      { name: "Tadasana", desc: "Postura de la montaña. De pie, pies paralelos, peso distribuido en las cuatro esquinas de cada pie. La columna se eleva sin tensión." },
      { name: "Virabhadrasana I", desc: "Guerrero I. Enraizamiento dinámico: la pierna posterior ancla mientras la anterior avanza. Presencia que no huye." },
      { name: "Malasana", desc: "Guirnalda. Cuclillas profundas con palmas unidas. Activa la raíz, abre las caderas, devuelve el cuerpo a su geometría ancestral." },
      { name: "Balasana", desc: "Postura del niño. Frente al suelo, rodillas abiertas, brazos extendidos. Rendición completa a la gravedad de Ādhāra." }
    ],
    pranayama: [
      { name: "Respiración Tierra (4-4-4)", desc: "Inhala 4 tiempos, retén 4, exhala 4. Ciclo cuadrado que estabiliza el sistema nervioso autónomo y ancla la atención en el cuerpo físico." },
      { name: "Bhramari (Abeja)", desc: "Exhala con el sonido mmm vibrado en el cráneo. La vibración desciende por la columna hasta el suelo pélvico, activando el nervio vago." }
    ]
  },
  {
    type: "dim",
    number: "Dimensión II",
    dimName: "Pravāha — La Dimensión del Flujo",
    title: "Movimiento: la conciencia que ondula",
    formula: {
      expr: "Ψ(x,t) = A · e^(i(kx − ωt))",
      desc: "La función de onda Ψ describe una conciencia en movimiento: amplitud A, vector de onda k, frecuencia angular ω. Fluir es ser real."
    },
    content: [
      "La segunda dimensión introduce el movimiento: la posibilidad de que algo se desplace a lo largo de la primera. Pravāha —flujo en sánscrito— es la dimensión donde la vida se distingue de la piedra. Todo sistema vivo fluye; todo sistema muerto se detiene.",
      "La mente que resiste el flujo produce sufrimiento. La tradición budista lo sabe desde hace veintiséis siglos: el apego —a personas, ideas, estados— es el intento de detener lo que por naturaleza se mueve. La teoría cuántica lo confirma desde otro ángulo: la función de onda existe solo en movimiento. Un sistema sin evolución temporal no es un sistema: es una abstracción.",
      "En el cuerpo, Pravāha habita en las caderas, el sacro y la región lumbar. Es la zona donde el movimiento se origina y se bloquea. La tensión crónica en la cadera es, en muchos casos, el registro físico de emociones que no pudieron fluir: tristeza detenida, ira no expresada, duelo interrumpido.",
      "La práctica de esta dimensión no busca velocidad sino continuidad. El movimiento consciente —lento, atento, sin destino ansioso— es más cuántico que el movimiento eficiente. Ondular es más cercano a la naturaleza de la realidad que avanzar en línea recta."
    ],

      desc: "La acción de la teoría M S_M integra sobre las 11 dimensiones la curvatura R y la constante cosmológica Λ. Todo el universo en una sola ecuación: la membrana que contiene todas las membranas."
    },
    content: [
      "Parā significa supremo, primordial, el origen antes del origen. En el Cachemira Shaivismo es el nivel más alto de la conciencia —Parā Vāk, el lenguaje antes del lenguaje, el pensamiento antes del pensamiento. En la teoría M, la undécima dimensión es aquella desde la cual las otras diez adquieren coherencia: es el espacio donde las diferentes teorías de cuerdas se unifican en una sola descripción.",
      "Llegar a la undécima dimensión del Camino no es llegar a ningún lugar. Es el reconocimiento de que el camino recorrido —desde Ādhāra hasta Ākāsha— no llevó a un destino sino que desplegó una comprensión que siempre estuvo presente. Como en la analogía platónica de la caverna invertida: no es que la luz estuviera oculta; es que el observador miraba en otra dirección.",
      "Parā es la práctica de la no-práctica: el estado en que el esfuerzo yóguico ya no es necesario porque la presencia se ha vuelto el modo natural del ser. No es pasividad —el practicante de Parā actúa con precisión y compromiso en el mundo— sino que actúa desde un fondo de quietud que ninguna circunstancia puede disipar.",
      "La fórmula de la acción de la teoría M es la expresión matemática más comprensiva que la física ha producido: integra toda la geometría del universo en un solo principio variacional. Parā es el equivalente contemplativo de esa fórmula: la comprensión que integra todas las prácticas anteriores en una sola cualidad de presencia. Desde aquí, Carpe Diem no es un esfuerzo. Es lo que queda cuando el esfuerzo ya no hace falta."
    ],
    asanas: [
      { name: "La secuencia completa de las once dimensiones", desc: "Una práctica que atraviesa una asana de cada dimensión en orden ascendente. El cuerpo recapitula el camino completo de Ādhāra a Parā." },
      { name: "Meditación sin objeto (Rigpa)", desc: "No hay postura específica. El practicante puede estar sentado, de pie, caminando. Parā no depende de la forma. La conciencia descansa en sí misma." },
      { name: "Shavasana final — la gran rendición", desc: "El cuerpo completamente entregado al suelo. Todo el viaje de once dimensiones culmina en la postura más simple: estar horizontal, sin hacer nada, siendo todo." },
      { name: "Cualquier postura ordinaria realizada con presencia total", desc: "Lavar los platos, caminar, sentarse a una mesa. Parā transforma toda acción en práctica. El asana final es la vida misma." }
    ],
    pranayama: [
      { name: "Respiración natural observada sin intervención", desc: "No hay técnica en Parā. El practicante observa la respiración tal como ocurre, sin modificarla. La paradoja: este es el pranayama más avanzado y el más simple." },
      { name: "Turiya (el cuarto estado)", desc: "No es una técnica sino un reconocimiento: el estado de conciencia que subyace a la vigilia, el sueño y el sueño profundo. Se reporta como el sustrato inmóvil de toda respiración." }
    ]
  },

  // ── CIERRE ──
  {
    type: "close",
    number: "Epílogo",
    dimName: "",
    title: "El camino no termina: colapsa",
    formula: null,
    content: [
      "Este libro no concluye porque el Camino no tiene destino fijo. Tiene dirección: mayor presencia, mayor honestidad, mayor capacidad de contacto con lo real.",
      "Cada una de las once dimensiones es un laboratorio del mismo principio: el observador que se vuelve más preciso colapsa realidades de mayor coherencia. Ādhāra le enseñó al cuerpo dónde está. Parā le recordó que siempre supo.",
      "La teoría M nos dice que existen dimensiones que no percibimos con los sentidos ordinarios. El Camino no pretende acceder a todas ellas. Pretende ampliar el rango: que el ser que ha recorrido estas páginas pueda habitar con mayor plenitud el espectro que ya le pertenece.",
      "Carpe Diem.",
      "No como mandato. Como descripción de lo único que, en rigor, existe: este instante, esta conciencia, esta posibilidad de colapsar algo verdadero."
    ],
    asanas: [], pranayama: []
  }
];

let current = null;
const overlay = document.getElementById('overlay');

// Build index
const listBase = document.getElementById('list-base');
const listDim  = document.getElementById('list-dim');
const listClose = document.getElementById('list-close');

CHAPTERS.forEach((ch, i) => {
  const btn = document.createElement('button');
  btn.className = 'chapter-btn' + (ch.type === 'dim' ? ' dim-chapter' : '');
  btn.innerHTML = `
    <span class="ch-num">${ch.number}</span>
    <span class="ch-info">
      <span class="ch-title-idx">${ch.title}</span>
      ${ch.dimName ? `<span class="ch-dim-name">${ch.dimName}</span>` : ''}
    </span>`;
  btn.addEventListener('click', () => openChapter(i));
  if (ch.type === 'base') listBase.appendChild(btn);
  else if (ch.type === 'dim') listDim.appendChild(btn);
  else listClose.appendChild(btn);
});

function transition(fn) {
  overlay.classList.add('fading');
  setTimeout(() => { fn(); overlay.classList.remove('fading'); window.scrollTo({top:0,behavior:'instant'}); }, 280);
}

function openChapter(idx) {
  transition(() => {
    current = idx;
    renderChapter();
    document.getElementById('home-view').style.display = 'none';
    const cv = document.getElementById('chapter-view');
    cv.classList.add('active');
  });
}

function goHome() {
  transition(() => {
    current = null;
    document.getElementById('home-view').style.display = 'block';
    const cv = document.getElementById('chapter-view');
    cv.classList.remove('active');
  });
}

function navChapter(dir) {
  const next = current + dir;
  if (next < 0 || next >= CHAPTERS.length) return;
  transition(() => { current = next; renderChapter(); });
}

function renderChapter() {
  const ch = CHAPTERS[current];
  document.getElementById('ch-number').textContent = ch.number;
  document.getElementById('ch-dimname').textContent = ch.dimName;
  document.getElementById('ch-dimname').style.display = ch.dimName ? 'block' : 'none';
  document.getElementById('ch-title').textContent = ch.title;

  // Formula
  const fBox = document.getElementById('ch-formula');
  if (ch.formula) {
    fBox.innerHTML = `
      <div class="formula-box">
        <div class="formula-label">Fórmula de la dimensión</div>
        <div class="formula-expr">${ch.formula.expr}</div>
        <div class="formula-desc">${ch.formula.desc}</div>
      </div>`;
  } else { fBox.innerHTML = ''; }

  // Body
  document.getElementById('ch-body').innerHTML = ch.content.map(p=>`<p>${p}</p>`).join('');

  // Practices
  const prac = document.getElementById('ch-practices');
  if (ch.asanas && ch.asanas.length) {
    prac.innerHTML = `
      <div class="practice-section">
        <div class="practice-title">Āsanas — Posturas</div>
        <div class="practice-grid">${ch.asanas.map(a=>`
          <div class="practice-card">
            <div class="practice-card-title">${a.name}</div>
            <div class="practice-card-desc">${a.desc}</div>
          </div>`).join('')}
        </div>
      </div>
      <div class="practice-section">
        <div class="practice-title">Prāṇāyāma — Respiración</div>
        <div class="practice-grid">${ch.pranayama.map(b=>`
          <div class="practice-card breath">
            <div class="practice-card-title">${b.name}</div>
            <div class="practice-card-desc">${b.desc}</div>
          </div>`).join('')}
        </div>
      </div>`;
  } else { prac.innerHTML = ''; }

  // Nav
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === CHAPTERS.length - 1;
  document.getElementById('prev-label').textContent = current > 0 ? CHAPTERS[current-1].number : '';
  document.getElementById('next-label').textContent = current < CHAPTERS.length-1 ? CHAPTERS[current+1].number : '';
  document.getElementById('nav-progress').textContent = `${current+1} / ${CHAPTERS.length}`;
}

// Starfield
const sf = document.getElementById('starfield');
for (let i = 0; i < 110; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() < 0.12 ? 2 : 1;
  s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${3+Math.random()*5}s;--delay:-${Math.random()*7}s;--min-op:${(0.05+Math.random()*0.1).toFixed(2)};--max-op:${(0.3+Math.random()*0.5).toFixed(2)}`;
  sf.appendChild(s);
}
</script>
</body>
